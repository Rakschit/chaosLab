<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChaosLab - Classroom results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages/classroom.css">
  <link rel="stylesheet" href="css/shared/nav.css">
</head>
<body>
<div id="site-nav"></div>

<main class="wrap">
  <section class="hero">
    <h1 id="title">Classroom results</h1>
    <p id="subtitle"></p>
  </section>

  <div class="msg" id="msg" role="status">Loading…</div>

  <div id="body" style="display:none">
    <div class="toolbar">
      <button class="btn" type="button" id="refresh">Refresh</button>
      <button class="btn" type="button" id="csv">Download CSV</button>
    </div>

    <div class="sec"><span class="label">Students</span><span class="hint" id="students-hint">best score, then shortest time</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Student</th><th>Email</th><th class="num">Best score</th><th class="num">Time taken</th><th class="num">Games started</th><th class="num">Submissions</th><th>Last submission</th></tr></thead>
      <tbody id="students"></tbody>
    </table></div>

    <div class="sec"><span class="label">All submissions</span><span class="hint" id="subs-hint"></span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Student</th><th class="num">Attempt</th><th class="num">Score</th><th class="num">Found</th><th>Result</th><th class="num">Time taken</th><th>When</th></tr></thead>
      <tbody id="subs"></tbody>
    </table></div>
  </div>

  <footer><span>ChaosLab</span><span><a href="classroom.html">Classrooms</a></span></footer>
</main>
<script src="js/core/auth-api.js"></script>
<script src="js/core/nav.js"></script>
<script src="js/core/api.js"></script>
<script src="js/pages/classroom-results.js"></script>
</body>
</html>
