<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChaosLab - Reset password</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="wrap narrow">
  <header>
    <div class="title"><span class="dot" id="status-dot"></span><b>ChaosLab</b><i>/ Reset password</i></div>
    <div class="meta"><a href="login.html">Log in</a></div>
  </header>

  <div class="sec"><span class="label">Choose a new password</span></div>

  <form id="reset-form" action="#" method="post" novalidate>
    <div class="field">
      <label for="password">New password (at least 12 characters)</label>
      <input id="password" name="password" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <button class="go" type="submit" id="save">Set new password</button>
  </form>

  <p class="hint mt center" id="links">Link not working? <a href="forgot-password.html">Request a new one</a></p>

  <footer><span>ChaosLab</span><span><a href="index.html">Home</a></span></footer>
</div>
<script src="js/auth-api.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
